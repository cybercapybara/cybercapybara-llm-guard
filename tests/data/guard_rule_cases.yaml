# Per-rule positive/negative detection corpus, ported from the Go reference's
# tests/rules/rules_cases_test.go. See task-1.9-report.md
# (.superpowers/sdd/2026-08-14-phase0-phase1-bootstrap-and-engine/) for the
# full derivation. Loaded by tests/unit/test_guard_rule_corpus.cpp.
#
# Schema: cases: [{rule_id, positives: [{text|text_b64, expect_span|expect_span_b64}],
#                   negatives|negatives_b64: [...]}]
# Every rule uses exactly ONE encoding throughout (never mixed within a rule):
#   - most hand-written rules (configs/rules.yaml) are PLAINTEXT (`text`/
#     `expect_span`/`negatives`) -- readable and diffable, since their
#     fixtures (Cyrillic PII, generic DSN/header/password shapes) don't
#     resemble a known secret-scanner format.
#   - the 220 gitleaks-derived rules (configs/rules.gitleaks.generated.yaml),
#     PLUS a handful of hand-written rules that are custom equivalents of a
#     well-known vendor secret format (access_tokens.npm-token,
#     access_tokens.private-key-pem, access_tokens.twilio-auth-token,
#     access_tokens.vault-token, api_keys.stripe-key,
#     api_keys.stripe-restricted), are reversed-base64url
#     (`text_b64`/`expect_span_b64`/`negatives_b64`), because those fixtures
#     are, by design, shaped exactly like real provider secrets and trip
#     GitHub's server-side secret-scanning push protection when committed as
#     plaintext -- confirmed empirically by two rounds of rejected pushes.
#
# To read an encoded rule's fixtures in plaintext (for review) or to encode a
# new fixture string by hand, use scripts/corpus-codec.py:
#   python3 scripts/corpus-codec.py decode tests/data/guard_rule_cases.yaml
#   python3 scripts/corpus-codec.py encode 'some fixture text'
#
# Per-rule case counts are pinned separately in guard_rule_cases.counts.yaml
# (regenerated alongside this file) so a future edit that moves a case
# between rules -- not just one that changes the grand total -- is caught.
