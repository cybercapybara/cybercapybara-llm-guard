{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "llm-guard.fullname" . }}
  labels:
    {{- include "llm-guard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "llm-guard.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      path: {{ .Values.serviceMonitor.path }}
{{- end }}
