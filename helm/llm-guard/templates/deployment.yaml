apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-guard.fullname" . }}
  labels:
    {{- include "llm-guard.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "llm-guard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "llm-guard.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.migrations.runAsInitContainer }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: RUN_MIGRATIONS_ONLY
              value: "true"
            {{- if .Values.externalDatabase.password }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-guard.fullname" . }}
                  key: database-password
            {{- end }}
            {{- include "llm-guard.databaseEnv" . | nindent 12 }}
            - name: DB_MIGRATIONS_ENABLED
              value: "true"
            # Clear the per-statement timeout for the migrate step: the runtime
            # default (30s) cancels the first non-trivial production migration
            # (a large index/backfill) mid-flight. This is a dedicated init
            # process that exits, so a long-running statement here is safe.
            - name: DB_STATEMENT_TIMEOUT_MS
              value: "0"
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.shutdown.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          # preStop hook gives the kube-proxy / endpoint controller time to
          # propagate the pod removal across the cluster before the process
          # starts its in-app drain.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ .Values.shutdown.preStopDelay | default 5 }}"]
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.path }}
              port: http
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          env:
            # Database password — injected from Secret. The binary assembles the
            # DSN from the discrete DATABASE_* parts below, so the password is
            # never embedded in a URL env var.
            {{- if .Values.externalDatabase.password }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-guard.fullname" . }}
                  key: database-password
            {{- end }}
            # Database (discrete parts → DSN built in code)
            {{- include "llm-guard.databaseEnv" . | nindent 12 }}
            - name: DB_POOL_SIZE
              value: {{ .Values.externalDatabase.poolSize | quote }}
            - name: DB_MIGRATIONS_ENABLED
              # ternary, not `default true`: Helm's `default` treats an explicit
              # `false` as empty and would flip it back to true, making every
              # replica race for the migration advisory lock.
              value: {{ ternary "true" "false" (.Values.externalDatabase.migrationsEnabled | default false) | quote }}
            # Redis / Cache
            {{- if .Values.externalRedis.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-guard.fullname" . }}
                  key: redis-password
            {{- end }}
            - name: REDIS_URL
              value: {{ .Values.externalRedis.url | quote }}
            - name: REDIS_USE_SENTINEL
              value: {{ .Values.externalRedis.useSentinel | quote }}
            {{- if .Values.externalRedis.useSentinel }}
            - name: REDIS_MASTER_NAME
              value: {{ .Values.externalRedis.masterName | quote }}
            - name: REDIS_SENTINEL_NODES
              value: {{ .Values.externalRedis.sentinelNodes | quote }}
            {{- end }}
            - name: CACHE_POOL_SIZE
              value: {{ .Values.externalRedis.poolSize | quote }}
            # Logging / Observability
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_NAME
              value: {{ .Values.logging.name | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.logging.serviceName | quote }}
            # Tracing / OTLP
            {{- if .Values.tracing.enabled }}
            - name: OTLP_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            {{- end }}
            # Server
            - name: SERVER_THREADS
              value: {{ .Values.server.threads | quote }}
            - name: SHUTDOWN_PRE_STOP_DELAY_SEC
              value: {{ .Values.shutdown.shutdownPreStopDelaySec | default 5 | quote }}
            - name: APP_ENV
              value: {{ .Values.app.env | default "production" | quote }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ include "llm-guard.fullname" . }}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
