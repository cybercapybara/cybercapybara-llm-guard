# ═══════════════════════════════════════════════════════════════
# STAGE preset for the cpp-env umbrella → *.stage.example.com
#
# The umbrella keeps the chart-default (test) credentials in-namespace, so there
# are NO real secrets here and this file is safe to commit (unlike the gitignored
# helm/**/values-prod.yaml).
#
# Deploy:
#   helm dependency build ./helm/cpp-env
#   helm upgrade --install stage ./helm/cpp-env -n env-stage --create-namespace \
#     -f helm/cpp-env/values-stage.yaml
#
# NOTE: the image tag below is pinned. Bump it to roll a newer release.
# ═══════════════════════════════════════════════════════════════

env: stage
baseDomain: example.com

llm-guard:
  image:
    tag: v1.4.0

# Stage exposes traces for QA walkthroughs.
jaeger:
  ingress:
    enabled: true
